name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/src/ProjectName.Api/ProjectName.Api.csproj
      - run: dotnet test backend/tests/UnitTests/UnitTests.csproj --collect:"XPlat Code Coverage"
      - run: dotnet test backend/tests/IntegrationTests/IntegrationTests.csproj --collect:"XPlat Code Coverage"
      - name: Check coverage >= 80%
        run: echo "Configure reportgenerator threshold gate for 80%"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
